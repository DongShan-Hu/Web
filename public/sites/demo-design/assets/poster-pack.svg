      <stop offset="0" stop-color="#3f96b4"/><stop offset=".45" stop-color="#63bcd4"/><stop offset="1" stop-color="#28708c"/>
    </linearGradient>
    <linearGradient id="noon" x1="0" y1="0" x2="1" y2="0">
