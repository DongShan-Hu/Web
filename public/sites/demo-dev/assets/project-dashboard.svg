  <path d="M64 250 L64 420 M64 420 L500 420" stroke="#24365a" stroke-width="1"/>
  <path d="M83 372 L119 346 L155 390 L191 322 L227 354 L263 306 L299 338 L335 282 L371 314 L407 266 L443 294 L479 250 L479 420 L83 420 Z" fill="url(#area)"/>
  <path d="M83 372 L119 346 L155 390 L191 322 L227 354 L263 306 L299 338 L335 282 L371 314 L407 266 L443 294 L479 250" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="479" cy="250" r="5.5" fill="#4fd1c5"/>
  <circle cx="479" cy="250" r="11" fill="#4fd1c5" opacity=".22"/>
  <g fill="#5c7089" font-family="ui-monospace,Consolas,monospace" font-size="10">
    <text x="76" y="438">10:00</text><text x="196" y="438">12:00</text><text x="316" y="438">14:00</text><text x="436" y="438">16:00</text>
  </g>
  <g filter="url(#soft)">
    <rect x="546" y="190" width="214" height="270" rx="12" fill="url(#panel)" stroke="#24365a"/>
  </g>
  <text x="570" y="222" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#8fa3bd">品类占比</text>
  <g transform="translate(653,318)">
    <circle r="52" fill="none" stroke="#24365a" stroke-width="16"/>
    <circle r="52" fill="none" stroke="#4fd1c5" stroke-width="16" stroke-dasharray="189 327" stroke-linecap="round" transform="rotate(-90)"/>
    <circle r="52" fill="none" stroke="#63b3ed" stroke-width="16" stroke-dasharray="78 327" stroke-dashoffset="-194" stroke-linecap="round" transform="rotate(-90)"/>
    <circle r="52" fill="none" stroke="#f6ad55" stroke-width="16" stroke-dasharray="39 327" stroke-dashoffset="-277" stroke-linecap="round" transform="rotate(-90)"/>
    <text y="4" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="15" fill="#ffffff">3 类</text>
  </g>
  <g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8fa3bd">
    <rect x="572" y="398" width="10" height="10" rx="3" fill="#4fd1c5"/><text x="590" y="408">数码 58%</text>
    <rect x="668" y="398" width="10" height="10" rx="3" fill="#63b3ed"/><text x="686" y="408">图书 24%</text>
    <rect x="572" y="424" width="10" height="10" rx="3" fill="#f6ad55"/><text x="590" y="434">生活 12%</text>
    <rect x="668" y="424" width="10" height="10" rx="3" fill="#24365a"/><text x="686" y="434">其他 6%</text>
