<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="运营数据大屏界面示意图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1a30"/><stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2b4a"/><stop offset="1" stop-color="#141f38"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fd1c5" stop-opacity=".38"/><stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd1c5"/><stop offset="1" stop-color="#63b3ed"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="700" cy="60" r="180" fill="#4fd1c5" opacity=".05"/>
  <text x="40" y="52" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="500" fill="#ffffff">运营数据大屏</text>
  <text x="168" y="51" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#5c7089">REALTIME · WebSocket 5s</text>
  <circle cx="742" cy="46" r="4" fill="#68d391"/>
  <circle cx="742" cy="46" r="9" fill="#68d391" opacity=".25"/>
  <g filter="url(#soft)" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="40" y="78" width="172" height="88" rx="10" fill="url(#panel)" stroke="#24365a"/>
    <text x="60" y="110" font-size="11.5" fill="#5c7089">今日订单</text>
    <text x="60" y="142" font-size="23" font-weight="500" fill="#ffffff" font-family="ui-monospace,Consolas,monospace">12,480</text>
    <text x="152" y="142" font-size="11" fill="#68d391">▲ 6.2%</text>
    <rect x="226" y="78" width="172" height="88" rx="10" fill="url(#panel)" stroke="#24365a"/>
    <text x="246" y="110" font-size="11.5" fill="#5c7089">在线用户</text>
    <text x="246" y="142" font-size="23" font-weight="500" fill="#ffffff" font-family="ui-monospace,Consolas,monospace">3,207</text>
    <text x="338" y="142" font-size="11" fill="#68d391">▲ 3.1%</text>
    <rect x="412" y="78" width="172" height="88" rx="10" fill="url(#panel)" stroke="#24365a"/>
    <text x="432" y="110" font-size="11.5" fill="#5c7089">支付成功率</text>
    <text x="432" y="142" font-size="23" font-weight="500" fill="#4fd1c5" font-family="ui-monospace,Consolas,monospace">98.6%</text>
    <rect x="598" y="78" width="162" height="88" rx="10" fill="url(#panel)" stroke="#24365a"/>
    <text x="618" y="110" font-size="11.5" fill="#5c7089">库存预警</text>
    <text x="618" y="142" font-size="23" font-weight="500" fill="#f6ad55" font-family="ui-monospace,Consolas,monospace">17</text>
  </g>
  <g filter="url(#soft)">
    <rect x="40" y="190" width="480" height="270" rx="12" fill="url(#panel)" stroke="#24365a"/>
  </g>
