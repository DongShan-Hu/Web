      <stop offset="0" stop-color="#287e8f"/><stop offset="1" stop-color="#205975"/>
    </linearGradient>
    <linearGradient id="chip1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd8cf"/><stop offset="1" stop-color="#4fa9a0"/>
