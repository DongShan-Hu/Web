# 此文件在 Nginx 的 http {} 中 include（默认 conf.d 即在此上下文）。
# 买域名后，替换 map 正则的域名后缀、server_name 和 public/config.js。
map $host $showcase_root {
    default /usr/share/nginx/html;
    ~^(?<site_slug>[a-z0-9]+(?:-[a-z0-9]+)*)\.134\.195\.211\.122\.sslip\.io$ /usr/share/nginx/html/sites/$site_slug;
}

server {
    listen 80;
    listen [::]:80;
    server_name 134.195.211.122 134.195.211.122.sslip.io *.134.195.211.122.sslip.io;
    root $showcase_root;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location ~ /\. {
        deny all;
    }
    location ~* \.(?:html|json|css|js)$ {
        expires -1;
        try_files $uri =404;
    }
    location ~* \.(?:webp|png|jpe?g|gif|svg|ico|woff2?|mp4|webm|pdf)$ {
        expires 1h;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
        root /usr/share/nginx/html;
    }
}
