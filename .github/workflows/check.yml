name: Check website
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and build static files
        run: npm run build
      - name: Build production image
        run: docker build -t dongshan-web-check .
      - name: Verify production Nginx
        shell: bash
        run: |
          docker run -d --name web-check -p 127.0.0.1:8080:80 dongshan-web-check
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ > /dev/null
          curl -fsS http://127.0.0.1:8080/sites/zhang-hong/ > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' --range 0-1023 http://127.0.0.1:8080/sites/zhang-hong/media/tiangang.mp4)" = 206
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/not-found)" = 404
      - name: Container logs
        if: failure()
        run: docker logs web-check || true
